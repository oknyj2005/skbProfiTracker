name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :26.2-fabric:build --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: skbProfiTracker
          path: build/versions/*.jar
          if-no-files-found: error

      # Pushing a tag like v0.1.0 publishes the jar on the Releases page, where anyone can
      # download it without signing in (unlike workflow artifacts).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notes=$(mktemp)
          awk -v heading="## ${GITHUB_REF_NAME#v}" '
            $0 == heading { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$release_notes"
          notes_args=(--generate-notes)
          if [[ -s "$release_notes" ]]; then
            notes_args=(--notes-file "$release_notes")
          fi
          cd build/versions
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" \
            ./*.jar SHA256SUMS.txt \
            --title "skbProfiTracker ${GITHUB_REF_NAME}" \
            --verify-tag "${notes_args[@]}"
