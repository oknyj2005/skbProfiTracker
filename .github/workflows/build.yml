name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :26.2-fabric:build --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: skbProfiTracker
          path: build/versions/*.jar
          if-no-files-found: error
